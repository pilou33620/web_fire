name: exécutables

# Compile le serveur pour chaque système et le moteur en WebAssembly, et les dépose dans la publication
# « binaires » : web_fire-<système>.tar.gz (.zip sous Windows), feu-wasm.tar.gz et leurs empreintes SHA-256,
# que binaires.sh et binaires.cmd prennent sur un poste sans cargo (Raspberry Pi, PC sans Rust).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl : exécutables statiques, indépendants de la glibc du poste (Raspberry Pi OS)
          - { os: ubuntu-latest, cible: x86_64-unknown-linux-musl, nom: linux-x86_64 }
          - { os: ubuntu-24.04-arm, cible: aarch64-unknown-linux-musl, nom: linux-aarch64 }
          - { os: macos-latest, cible: aarch64-apple-darwin, nom: macos-aarch64 }
          - { os: windows-latest, cible: x86_64-pc-windows-msvc, nom: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.cible }}

      - if: contains(matrix.cible, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release -p web_fire --bins --target ${{ matrix.cible }}

      - name: Archive (l'exécutable et le commit dont il vient)
        shell: bash
        run: |
          mkdir bin
          cd target/${{ matrix.cible }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            cp ./*.exe ../../../bin/
          else
            find . -maxdepth 1 -type f -perm -u+x -exec cp {} ../../../bin/ \;
          fi
          cd ../../..
          git rev-parse HEAD > bin/commit
          if [ "${{ runner.os }}" = Windows ]; then
            (cd bin && 7z a ../web_fire-${{ matrix.nom }}.zip .)
          else
            tar -czf web_fire-${{ matrix.nom }}.tar.gz -C bin .
          fi

      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # les compilations arrivent ensemble : une seule crée la publication
          gh release view binaires >/dev/null 2>&1 \
            || gh release create binaires --title "Exécutables" \
                 --notes "Exécutables du simulateur et moteur WebAssembly, recompilés à chaque envoi sur main, pris par binaires.sh et binaires.cmd." \
            || true
          for f in web_fire-${{ matrix.nom }}.*; do
            (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") | cut -d" " -f1 > "$f.sha256"
          done
          gh release upload binaires web_fire-${{ matrix.nom }}.* --clobber

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: rustup target add wasm32-unknown-unknown

      - run: cargo build --release -p feu_wasm --target wasm32-unknown-unknown

      # wasm-bindgen-cli doit avoir exactement la version de la dépendance wasm-bindgen
      - name: wasm-bindgen
        run: |
          V=$(cargo pkgid -p wasm-bindgen | sed 's/.*[#@]//')
          echo "wasm-bindgen $V"
          cargo install wasm-bindgen-cli --version "$V" --locked
          mkdir wasm
          wasm-bindgen --target web --no-typescript --out-dir wasm target/wasm32-unknown-unknown/release/feu_wasm.wasm
          git rev-parse HEAD > wasm/commit
          tar -czf feu-wasm.tar.gz -C wasm .
          sha256sum feu-wasm.tar.gz | cut -d" " -f1 > feu-wasm.tar.gz.sha256
          ls -l wasm

      # le WASM produit doit se charger et jouer depuis JavaScript (par LiaisonWasm) avant d'être publié
      - name: Essai du WASM
        run: cp -r wasm web/wasm && node tests/wasm.test.mjs

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view binaires >/dev/null 2>&1 \
            || gh release create binaires --title "Exécutables" \
                 --notes "Exécutables du simulateur et moteur WebAssembly, recompilés à chaque envoi sur main, pris par binaires.sh et binaires.cmd." \
            || true
          gh release upload binaires feu-wasm.tar.gz feu-wasm.tar.gz.sha256 --clobber
